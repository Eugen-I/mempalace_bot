name: CI

on:
  push:
    branches: [main, master, 'fix/**']
  pull_request:

permissions:
  contents: read

# Baseline for the audit branch (tracked files only; Garmin WIP stays untracked):
#   flake8: 0, mypy: 0 errors / 114 files, pytest: 3764 passed,
#   bandit (tracked Python): 48 Low / 0 Medium / 0 High.
# Gate rule: blocking steps must be green. New Medium/High bandit findings fail;
# Low findings are accepted at the recorded baseline. pip-audit and the BDD
# dry-run are diagnostic until the dependency/step-definition backlog is closed.
# Mutation testing stays local (`make mutate`): it is too slow for the PR gate.

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Lint (flake8)
        run: python -m flake8 .

      - name: Typecheck (mypy)
        run: python -m mypy --explicit-package-bases handlers/ services/ main.py config.py

      - name: Tests (pytest + coverage)
        run: python -m pytest --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=5

      - name: Security (bandit, tracked Python only)
        run: |
          git ls-files -z 'handlers/*.py' 'services/*.py' \
            | xargs -0 python -m bandit -ll

      - name: Dependency audit (diagnostic)
        continue-on-error: true
        run: python -m pip_audit --progress-spinner off

      - name: BDD dry-run (diagnostic)
        continue-on-error: true
        run: python -m behave --dry-run
