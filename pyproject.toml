[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "services*", "handlers*"]
exclude = ["features*", "tests*", "docs*", "_scripts*"]

[project]
name = "mempalace-bot"
version = "0.1.0"
description = "Telegram bot for MemPalace local AI workflows"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Yevgeniy Pit" }
]
dependencies = [
  "aiogram>=3.27",
  "python-dotenv>=1.2",
  "openai>=2.32",
  "google-genai>=1.73",
  "yt-dlp>=2026.7",
  "faster-whisper>=1.2",
  "rich>=15.0",
  "cachetools>=5.3",
  "tavily-python>=0.7",
  "httpx>=0.28",
  "selectolax>=0.3.11",
  "aiofiles>=23.2.1",
  "numpy>=2.0",
  "prompt-toolkit>=3.0"
]

[project.optional-dependencies]
scripts = ["chromadb==1.5.9"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "pytest-asyncio>=0.24",
  "behave>=1.2.6",
  "flake8>=7.1",
  "mypy>=1.13",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "pre-commit>=3.8",
  "mutmut>=3.2",
  "vulture>=2.7"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib --cov=. --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "tests/*",
  "features/*",
  "venv/*",
  ".venv/*",
  "build/*",
  "dist/*"
]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError"
]

[tool.mutmut]
backup = true
source_paths = ["services/file_index.py"]
also_copy = ["config.py", "main.py", "cli_ask.py", "cli_extras.py", "cli", "handlers", "services"]
pytest_add_cli_args = ["--override-ini=addopts=-ra", "-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = ["tests/test_file_index.py"]
swhitelist = [
  "*/venv/*",
  "*/__pycache__/*",
  "*.pytest_cache/*"
]
coverage = false

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = true
explicit_package_bases = true
exclude = ["tests/", "venv/", ".venv/", "features/"]

[[tool.mypy.overrides]]
# aiogram 3.x stubs: CallbackQuery.message → Message|InaccessibleMessage|None,
# но в callback-хендлерах гарантированно Message. False positive.
module = [
  "handlers.*",
  "main",
  "config",
  "services.*",
  "services.web_search",
  "services.web_search_cache",
]
disable_error_code = ["union-attr", "arg-type", "index"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "features"]
skips = ["B101"]

[tool.vulture]
exclude = ["venv/", ".venv/", "tests/", "features/"]
paths = ["handlers/", "services/", "main.py", "config.py"]
