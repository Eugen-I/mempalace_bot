repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies: []
        # flake8 ignores .flake8 exclude rules when pre-commit passes paths
        # explicitly; mirror the directories here (INC-15).
        exclude: ^(tests/|features/|_scripts/|mutants/|cli_ask\.py$|.*MemPalace.*)

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: no-secrets
        name: no-secrets
        entry: python3 .git-hooks/check_no_secrets.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
