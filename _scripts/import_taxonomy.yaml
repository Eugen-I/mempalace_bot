# Таксономия крыльев и комнат для импорта заметок.
#
# Как это работает:
#   - Крыло (wing) = домен знаний (Философия, Психология, Фотография...).
#   - Комната (room) = личность (Эмиль Чоран, Ницше) или устойчивая тема (Сознание, История фотографии).
#   - AI предлагает крыло/комнату/личность, скрипт сверяет их с этой таксономией:
#     синонимы -> каноническое имя, похожие темы сливаются в существующие комнаты.
#
# Как добавить своё крыло: добавьте блок в "wings" (name — имя крыла, synonyms —
# слова, по которым заметка относится к этому крылу; слово-корень ловит все формы:
# "философ" найдёт "философия", "философский").
# Как объединить темы: добавьте группу в "room_synonyms" — все комнаты, чьи имена
# попадают в synonyms, сольются в одну комнату name.

wings:
  - name: Философия
    synonyms: [философ, нигилизм, экзистенци, стоицизм, бытие, смысл жизни, чоран, ницше, шопенгауэр]
  - name: Психология
    synonyms: [психолог, психоанализ, архетип, сознани, бессознательн, подсознан, личность, юнг, фрейд, саморефлекси]
  - name: Фотография
    synonyms: [фотограф, фотографи, съёмк, съемк, камера, экспозици, пиктореализм, объектив, снимк]
  - name: Творчество
    synonyms: [творчеств, искусств, креатив, вдохновени, манифест, живопис]
  - name: Сны
    synonyms: [сон, сны, сновидени, кошмар, сонник]
  - name: Литература
    synonyms: [книг, поэт, стих, проза, литератур, роман, цитат]
  - name: Работа
    synonyms: [работа, проект, бизнес, офис, дедлайн, задаче]
  - name: Здоровье
    synonyms: [здоровь, спорт, тренировк, питани, медитаци, йог]
  - name: Другое
    synonyms: []

room_synonyms:
  - name: Сознание
    synonyms: [сознани, мышлени, самосознани, осознанност, развитие мышления, внимание]
  - name: Сны
    synonyms: [сны, сновидени, кошмар, сонник]
  - name: Творчество
    synonyms: [творческ, креативн, вдохновени]
  - name: История фотографии
    synonyms: [истори фотографи, пиктореализм]
  - name: Психология личности
    synonyms: [психология личности, личность, саморефлекси, самопознани]
  - name: Архетипы
    synonyms: [архетип, социальная маска, персона]
  - name: Бессознательное
    synonyms: [бессознательн, подсознан, коллективное бессознательное]
  - name: Философские парадоксы
    synonyms: [парадокс, противоречи, апори]
